# Compilación y publicación de iOS sin Mac.
#
# El desarrollo va en Linux, así que la única forma de compilar, firmar y subir
# a TestFlight es una máquina macOS en la nube. Codemagic genera el certificado
# y el perfil por la API de App Store Connect: no hace falta un Mac en ningún
# momento, ni para firmar ni para subir.
#
# ANTES DEL PRIMER BUILD hay que hacer tres cosas en la interfaz de Codemagic,
# que no se pueden dejar escritas aquí:
#
#   1. Crear una API key en App Store Connect (Users and Access → Integrations,
#      rol App Manager) y cargarla en Codemagic → Teams → Integrations →
#      App Store Connect, con el nombre `mohana-app-store-connect`. Si le pones
#      otro nombre, cámbialo abajo en `integrations`.
#   2. Conectar este repositorio en Codemagic y lanzar el primer build.
#
# Ya hechos: la app existe en App Store Connect con el bundle id
# `com.ofp.lamohanaradio` (Apple ID 6836393064) y el App ID está registrado en el
# portal de desarrollador. Team ID: 5WGZBLZBDM.
#
# El plan gratuito da unos 500 minutos de macOS al mes y un build en paralelo.
# Un build de esta app ronda 10-15 min, así que sobra de largo.

workflows:
  ios-testflight:
    name: iOS · TestFlight
    # El proyecto Flutter vive en `app/`, no en la raíz del repositorio.
    working_directory: app
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: mohana-app-store-connect

    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
      ios_signing:
        # Firma automática: Codemagic crea el certificado de distribución y el
        # perfil a partir de la API key, y deja el export_options.plist en
        # /Users/builder/export_options.plist, que es el que usa el build.
        distribution_type: app_store
        bundle_identifier: com.ofp.lamohanaradio
      vars:
        BUNDLE_ID: com.ofp.lamohanaradio
        # Apple ID numérico de la app en App Store Connect.
        APP_STORE_APPLE_ID: 6836393064

    cache:
      cache_paths:
        - $HOME/.pub-cache

    triggering:
      # Nada automático de momento: los builds se lanzan a mano desde Codemagic
      # mientras se estabiliza la primera subida. Cuando esto funcione sin
      # sobresaltos, se puede activar el disparo por etiquetas.
      events: []

    scripts:
      - name: Dependencias de Flutter
        script: flutter pub get

      - name: Análisis y pruebas
        # Falla pronto y barato: si los tests no pasan, no gastamos minutos de
        # macOS compilando. Los 307 tests tardan unos 15 s.
        script: |
          flutter analyze
          flutter test

      - name: Número de build
        # El número sale de lo que ya hay en TestFlight, no de pubspec.yaml: así
        # nunca se repite, que es lo único que Apple exige. El nombre de versión
        # (1.3.0) sí sale de pubspec.
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          echo "FLUTTER_BUILD_NUMBER=$((BUILD_NUMBER + 1))" >> $CM_ENV

      - name: CocoaPods
        # Esta app nunca se ha compilado para iOS: no hay Podfile.lock en el
        # repositorio y los pods de just_audio_background se resuelven aquí por
        # primera vez. Es el paso con más probabilidad de fallar en el estreno.
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Compilar IPA
        script: |
          flutter build ipa --release \
            --build-number=$FLUTTER_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      # Los logs de Xcode son lo primero que hay que mirar cuando el build falla
      # y desde Linux no se puede reproducir.
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # Sube a TestFlight, no a revisión. El envío a la tienda se hace a mano
        # desde App Store Connect, después de probar en un iPhone de verdad.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          # PENDIENTE: correo al que avisar del resultado del build.
          - jbecerrap95@gmail.com
        notify:
          success: true
          failure: true
